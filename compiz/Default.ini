[core]
as_active_plugins = core;ccp;dbus;decoration;regex;place;move;resize;wobbly;animation;text;switcher;workarounds;
s0_unredirect_fullscreen_windows = true

[wobbly]
s0_map_effect = 1

[decoration]
as_command = gtk-window-decorator --replace --marco-theme WhiteSur-Dark --button-layout ":minimize,maximize,close"

[animation]
s0_open_durations = 150;150;150;
s0_close_durations = 150;120;120;

