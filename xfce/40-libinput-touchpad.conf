Section "InputClass"
    Identifier "libinput touchpad tap to click"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "ScrollPixelDistance" "36"
EndSection
